<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Utkio Android — Audio Talk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #FBF1E6;
      --card: #ffffff;
      --panel-2: #F5ECDF;
      --ink: #23263a;
      --ink-dim: #6f6558;
      --line: #ECDFCB;
      --accent: #6a63f1;
      --accent-soft: #e7e5fd;
      --bad: #bf3a40;
      --accent-orange: #d9694b;
      --accent-soft-orange: #f6e2da;
      --good: #3a9463;
      --font-serif: Georgia, 'Times New Roman', serif;
      --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrap {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 20px calc(14px + env(safe-area-inset-bottom, 0px));
    }

    /* ---- Android Native Engine Badge ---- */
    .engine-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 2px;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--accent-orange);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .engine-indicator .engine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--good);
    }

    /* ---- Top bar (Utkio Chat Header) ---- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      padding: 8px;
      border-radius: 10px;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .icon-btn:active {
      background: rgba(0, 0, 0, 0.08);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    .app-title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.1;
    }

    .app-title::after {
      content: '.';
      color: var(--accent-orange);
    }

    .model-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--accent-orange);
      background: var(--accent-soft-orange);
      padding: 1px 7px;
      border-radius: 999px;
      margin-top: 1px;
      font-weight: 600;
    }

    /* ---- Timer Banner (Uper me time show karne wala) ---- */
    .timer-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 2px auto 6px;
      padding: 3px 14px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .timer-pill .timer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-orange);
      animation: pulse-timer 1.5s infinite;
    }

    @keyframes pulse-timer {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* ---- Status Row ---- */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 2px 0 10px;
      flex-shrink: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-dim);
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .dot.live {
      background: var(--good);
      box-shadow: 0 0 8px rgba(58, 148, 99, 0.5);
    }

    .dot.listening {
      background: var(--accent-orange);
      box-shadow: 0 0 8px rgba(217, 105, 75, 0.6);
      animation: pulse-dot 1.2s infinite;
    }

    .dot.thinking {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(106, 99, 241, 0.6);
      animation: pulse-dot 0.8s infinite;
    }

    .dot.err {
      background: var(--bad);
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    #statusText {
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--ink-dim);
    }

    /* ---- Chat Card (Transcript Viewport) ---- */
    .chat-card {
      flex: 1;
      min-height: 0;
      background: var(--card);
      border-radius: 26px;
      padding: 18px 14px;
      box-shadow: 0 20px 40px -20px rgba(60, 60, 120, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(217, 105, 75, 0.06);
    }

    .transcript {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 2px;
      padding-bottom: 4px;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .transcript::-webkit-scrollbar {
      display: none;
    }

    .transcript-empty {
      color: var(--ink-dim);
      font-size: 0.88rem;
      font-style: italic;
      margin: auto;
      text-align: center;
      padding: 20px;
      line-height: 1.5;
    }

    /* Utkio Message Rows */
    .line-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 88%;
      animation: messageIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .line-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .line-row.model {
      align-self: flex-start;
    }

    .avatar-chip {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-bottom: 2px;
      background: var(--accent-soft-orange);
      color: var(--accent-orange);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-chip svg {
      width: 15px;
      height: 15px;
    }

    .line-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .line-row.user .line-col {
      align-items: flex-end;
    }

    .line {
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .line.user {
      background: var(--accent-soft-orange);
      color: var(--ink);
      border-bottom-right-radius: 4px;
    }

    .line.model {
      background: var(--panel-2);
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }

    .line.interim {
      opacity: 0.7;
      font-style: italic;
    }

    .line-meta {
      font-size: 0.68rem;
      color: var(--ink-dim);
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
    }

    /* ---- Mic Dock (Utkio Signature Wave & Button) ---- */
    .mic-dock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 84px;
      margin-top: 10px;
      flex-shrink: 0;
    }

    .wave {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 3px;
      opacity: 0.35;
      pointer-events: none;
      max-width: 110px;
    }

    .wave.wave-left {
      justify-content: flex-end;
    }

    .wave.wave-right {
      justify-content: flex-start;
    }

    .wave span {
      width: 3px;
      border-radius: 2px;
      background: var(--accent-orange);
      opacity: 0.55;
      height: 6px;
      transition: height 0.15s ease;
    }

    .wave.active span {
      animation: wave-anim 0.8s infinite ease-in-out alternate;
    }

    .wave.active span:nth-child(1) { animation-delay: 0.1s; }
    .wave.active span:nth-child(2) { animation-delay: 0.3s; }
    .wave.active span:nth-child(3) { animation-delay: 0.5s; }
    .wave.active span:nth-child(4) { animation-delay: 0.2s; }
    .wave.active span:nth-child(5) { animation-delay: 0.4s; }

    @keyframes wave-anim {
      0% { height: 6px; }
      100% { height: 24px; }
    }

    .mic-btn {
      position: relative;
      z-index: 1;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--accent-orange);
      border: none;
      box-shadow: 0 6px 16px -6px rgba(217, 105, 75, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
      touch-action: manipulation;
      outline: none;
    }

    .mic-btn:active {
      transform: scale(0.96);
    }

    .mic-btn.active {
      box-shadow: 0 0 0 12px rgba(217, 105, 75, 0.16), 0 0 24px 6px rgba(217, 105, 75, 0.45);
      background: #c85a3d;
    }

    .mic-btn.thinking {
      background: var(--accent);
      box-shadow: 0 0 0 10px rgba(106, 99, 241, 0.2), 0 0 20px rgba(106, 99, 241, 0.4);
    }

    .mic-btn svg {
      width: 28px;
      height: 28px;
      color: #fff;
    }

    footer {
      margin-top: 8px;
      color: var(--ink-dim);
      font-size: 0.72rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-shrink: 0;
    }

    /* ---- API Key Settings Modal ---- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 38, 58, 0.5);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--line);
    }

    .modal-card h3 {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .modal-card p {
      font-size: 0.84rem;
      color: var(--ink-dim);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal-input-wrap {
      margin-bottom: 16px;
    }

    .modal-input {
      width: 100%;
      background: var(--panel-2);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--ink);
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--accent-orange);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .modal-btn.primary {
      background: var(--accent-orange);
      color: #fff;
    }

    .modal-btn.secondary {
      background: var(--panel-2);
      color: var(--ink);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- Android Native Engine Banner -->
    <div class="engine-indicator" id="engineBadge">
      <span class="engine-dot"></span>
      <span id="engineLabel">Android Native Bridge Active</span>
    </div>

    <!-- Topbar (Utkio Brand + Session Controls) -->
    <header class="topbar">
      <button class="icon-btn" id="newChatBtn" aria-label="New Session" title="Start New Session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>

      <div class="app-title-group">
        <h1 class="app-title">Utkio</h1>
        <span class="model-badge">gemini-3.1-flash-lite</span>
      </div>

      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="API Key Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83-2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </header>

    <!-- Session Duration Timer (Uper me time show karne wala) -->
    <div class="timer-pill" id="timerPill">
      <span class="timer-dot"></span>
      <span id="sessionTimerText">⏱️ 0:00</span>
    </div>

    <!-- Status Indicator Row -->
    <div class="status-row">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Tap mic button to speak</span>
    </div>

    <!-- Main Chat Card -->
    <div class="chat-card">
      <div class="transcript" id="transcript">
        <div class="transcript-empty" id="transcriptEmpty">
          The chat will appear here once the conversation starts
        </div>
      </div>
    </div>

    <!-- Utkio Signature Mic Dock -->
    <div class="mic-dock">
      <div class="wave wave-left" id="waveLeft" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <button id="micBtn" class="mic-btn" aria-label="Start/stop talking">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
      </button>
      <div class="wave wave-right" id="waveRight" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <footer>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;">
        <rect x="3" y="11" width="18" height="11" rx="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
      <span>Android On-Device Speech &amp; Gemini Flash-Lite</span>
    </footer>
  </div>

  <!-- Settings / API Key Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <h3>Gemini API Key</h3>
      <p>Enter your Google Gemini API Key for on-device conversational testing.</p>
      <div class="modal-input-wrap">
        <input type="password" id="modalKeyInput" class="modal-input" placeholder="AIzaSy...">
      </div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="modalCloseBtn">Cancel</button>
        <button class="modal-btn primary" id="modalSaveBtn">Save Key</button>
      </div>
    </div>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────────────────────────
    // Utkio Android App Voice Engine — Native Android Bridge + Gemini 3.1 Flash-Lite
    // ─────────────────────────────────────────────────────────────────────────────

    const PRIMARY_MODEL = 'gemini-3.1-flash-lite';
    const FALLBACK_MODEL = 'gemini-2.0-flash-lite';

    const SYSTEM_INSTRUCTION = `You are "Utkio", a warm, friendly, non-judgmental Indian AI English Coach.
CRITICAL SPOKEN AUDIO RULES:
1. Speak in natural, friendly HINGLISH: seamlessly blend relatable, warm Hindi conversational phrases (e.g., "Arre bilkul", "Haan dekho", "Don't worry yaar", "Matlab", "Aap batao") with clean, fluent English.
2. Keep your spoken audio short, energetic, and snappy: strictly 1 to 2 short sentences per turn so speech synthesis flows rapidly.
3. If the user makes a hesitation or grammatical mistake, gently model the better English phrasing in your reply without lecturing.
4. Always end with an easy question to keep the spoken dialogue flowing.`;

    // DOM Elements
    const engineBadge = document.getElementById('engineBadge');
    const engineLabel = document.getElementById('engineLabel');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const transcript = document.getElementById('transcript');
    const transcriptEmpty = document.getElementById('transcriptEmpty');
    const micBtn = document.getElementById('micBtn');
    const waveLeft = document.getElementById('waveLeft');
    const waveRight = document.getElementById('waveRight');
    const sessionTimerText = document.getElementById('sessionTimerText');
    const newChatBtn = document.getElementById('newChatBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const modalKeyInput = document.getElementById('modalKeyInput');
    const modalSaveBtn = document.getElementById('modalSaveBtn');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    // Engine & State (Dynamic Bridge Resolver to eliminate init race conditions)
    function getNativeBridge() {
      return typeof window.UtkioNativeBridge !== 'undefined' ? window.UtkioNativeBridge : null;
    }
    let apiKey = localStorage.getItem('utkio_gemini_api_key') || '';
    let state = 'IDLE'; // IDLE | LISTENING | THINKING | SPEAKING
    let conversationHistory = [];
    let activeAbortController = null;
    let currentUserRow = null;
    let currentModelRow = null;
    let sentenceQueue = [];
    let isSpeakingQueue = false;
    let sentenceBuffer = '';
    let llmStartTime = 0;
    let utteranceCounter = 0;

    // Web Speech Fallback for browser testing
    let webRecognition = null;
    let webSynth = window.speechSynthesis;
    let selectedWebVoice = null;

    // Session Timer
    let sessionSeconds = 0;
    let timerInterval = null;
    let isSessionStarted = false;

    // ─────────────────────────────────────────────────────────────────────────────
    // Init & Setup
    // ─────────────────────────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      initEngineMode();
      setupEventListeners();

      if (!apiKey) {
        openSettingsModal();
      }
    });

    function initEngineMode() {
      if (getNativeBridge()) {
        engineLabel.textContent = 'Android Native Bridge Active (0ms On-Device)';
        setupAndroidNativeListeners();
      } else {
        engineLabel.textContent = 'Web Engine Mode (Browser Preview)';
        initWebSpeechFallback();
      }
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // Android Native Bridge Listeners (UtkioNativeBridge via MainActivity.java)
    // ─────────────────────────────────────────────────────────────────────────────
    function setupAndroidNativeListeners() {
      // 1. Partial user speech as they talk
      window.addEventListener('stt-partial', (e) => {
        const partialText = (e.detail && e.detail.text) || '';
        if (currentUserRow && partialText) {
          const lineEl = currentUserRow.querySelector('.line.user');
          lineEl.textContent = partialText;
          lineEl.classList.add('interim');
        }
      });

      // 2. Final user speech detected by Android SpeechRecognizer
      window.addEventListener('stt-final', (e) => {
        const finalText = (e.detail && e.detail.text) || '';
        if (currentUserRow) {
          const lineEl = currentUserRow.querySelector('.line.user');
          if (finalText.trim()) {
            lineEl.textContent = finalText.trim();
            lineEl.classList.remove('interim');
            streamGeminiFlash(finalText.trim());
          } else {
            currentUserRow.remove();
            currentUserRow = null;
            setState('IDLE');
          }
        }
      });

      // 3. Native STT Ready (SpeechRecognizer is listening)
      window.addEventListener('stt-ready', () => {
        if (state !== 'LISTENING') {
          setState('LISTENING');
        }
      });

      // 4. Native STT Error (Atomic Error Reconciliation - Purges orphan interim bubble)
      window.addEventListener('stt-error', (e) => {
        const code = (e.detail && e.detail.code) != null ? e.detail.code : -1;
        console.warn('Android STT Error:', code, e.detail);
        if (currentUserRow) {
          const lineEl = currentUserRow.querySelector('.line.user');
          if (lineEl && (lineEl.classList.contains('interim') || lineEl.textContent.trim() === 'Listening...')) {
            currentUserRow.remove();
            currentUserRow = null;
          }
        }
        setState('IDLE');
        if (code === 7 || code === 6) {
          statusText.textContent = 'No speech heard. Tap mic to talk.';
        } else if (code === 9) {
          statusText.textContent = 'Microphone permission needed.';
        } else {
          statusText.textContent = 'Could not catch audio (code ' + code + '). Tap mic to try again.';
        }
      });

      // 5. Native Android TTS Utterance Completed
      window.addEventListener('tts-done', (e) => {
        playNextSentence();
      });
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // Web Speech Fallback (For local browser preview when outside APK)
    // ─────────────────────────────────────────────────────────────────────────────
    function initWebSpeechFallback() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        webRecognition = new SpeechRecognition();
        webRecognition.lang = 'en-IN';
        webRecognition.continuous = false;
        webRecognition.interimResults = true;

        webRecognition.onstart = () => {
          startSessionTimer();
          setState('LISTENING');
          removeEmptyPlaceholder();
          createUserMessageRow();
        };

        webRecognition.onresult = (e) => {
          let interimText = '';
          let finalText = '';
          for (let i = e.resultIndex; i < e.results.length; ++i) {
            if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
            else interimText += e.results[i][0].transcript;
          }
          if (currentUserRow) {
            const lineEl = currentUserRow.querySelector('.line.user');
            if (finalText) {
              lineEl.textContent = finalText;
              lineEl.classList.remove('interim');
            } else if (interimText) {
              lineEl.textContent = interimText;
              lineEl.classList.add('interim');
            }
          }
        };

        webRecognition.onerror = (e) => {
          console.warn('Web STT Error:', e.error);
          if (currentUserRow) {
            const lineEl = currentUserRow.querySelector('.line.user');
            if (lineEl && (lineEl.classList.contains('interim') || lineEl.textContent.trim() === 'Listening...')) {
              currentUserRow.remove();
              currentUserRow = null;
            }
          }
          setState('IDLE');
          statusText.textContent = 'Could not catch audio. Tap mic to try again.';
        };

        webRecognition.onend = () => {
          if (currentUserRow) {
            const lineEl = currentUserRow.querySelector('.line.user');
            const promptText = lineEl.textContent.trim();
            if (promptText && promptText !== 'Listening...') {
              lineEl.classList.remove('interim');
              streamGeminiFlash(promptText);
            } else {
              currentUserRow.remove();
              currentUserRow = null;
              setState('IDLE');
            }
          } else {
            setState('IDLE');
          }
        };
      }

      if (webSynth) {
        const loadVoices = () => {
          const voices = webSynth.getVoices();
          selectedWebVoice = voices.find(v => v.lang === 'en-IN' || v.name.includes('India')) || voices[0];
        };
        loadVoices();
        if (webSynth.onvoiceschanged !== undefined) webSynth.onvoiceschanged = loadVoices;
      }
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // UI Event Listeners
    // ─────────────────────────────────────────────────────────────────────────────
    function setupEventListeners() {
      settingsBtn.addEventListener('click', openSettingsModal);
      modalCloseBtn.addEventListener('click', closeSettingsModal);
      modalSaveBtn.addEventListener('click', () => {
        apiKey = modalKeyInput.value.trim();
        localStorage.setItem('utkio_gemini_api_key', apiKey);
        closeSettingsModal();
        statusText.textContent = 'API Key saved. Tap mic to talk.';
      });

      newChatBtn.addEventListener('click', resetSession);

      micBtn.addEventListener('click', () => {
        if (state === 'LISTENING') {
          stopListening();
        } else if (state === 'SPEAKING' || state === 'THINKING') {
          stopAllAudio();
          startListening();
        } else {
          startListening();
        }
      });
    }

    function openSettingsModal() {
      modalKeyInput.value = apiKey;
      settingsModal.classList.add('open');
      modalKeyInput.focus();
    }

    function closeSettingsModal() {
      settingsModal.classList.remove('open');
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // Session Timer Logic (formatTime: 0:00 -> 1:45)
    // ─────────────────────────────────────────────────────────────────────────────
    function startSessionTimer() {
      if (isSessionStarted) return;
      isSessionStarted = true;
      sessionSeconds = 0;
      updateTimerDisplay();

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        sessionSeconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(sessionSeconds / 60);
      const secs = sessionSeconds % 60;
      sessionTimerText.textContent = `⏱️ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function resetSession() {
      stopAllAudio();
      conversationHistory = [];
      sessionSeconds = 0;
      isSessionStarted = false;
      if (timerInterval) clearInterval(timerInterval);
      updateTimerDisplay();

      transcript.innerHTML = `
        <div class="transcript-empty" id="transcriptEmpty">
          The chat will appear here once the conversation starts
        </div>
      `;
      setState('IDLE');
      statusText.textContent = 'Tap the mic button below to start';
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // State Manager
    // ─────────────────────────────────────────────────────────────────────────────
    function setState(newState) {
      state = newState;
      statusDot.className = 'dot';
      micBtn.className = 'mic-btn';
      waveLeft.className = 'wave wave-left';
      waveRight.className = 'wave wave-right';

      switch (state) {
        case 'IDLE':
          statusDot.classList.add('live');
          statusText.textContent = 'Tap the mic button to speak';
          break;
        case 'LISTENING':
          statusDot.classList.add('listening');
          micBtn.classList.add('active');
          waveLeft.classList.add('active');
          waveRight.classList.add('active');
          statusText.textContent = 'Listening to you...';
          break;
        case 'THINKING':
          statusDot.classList.add('thinking');
          micBtn.classList.add('thinking');
          statusText.textContent = 'Utkio is thinking...';
          break;
        case 'SPEAKING':
          statusDot.classList.add('live');
          micBtn.classList.add('active');
          waveLeft.classList.add('active');
          waveRight.classList.add('active');
          statusText.textContent = 'Utkio speaking (tap to interrupt)';
          break;
      }
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // Speech Input Operations (Android Native vs Web Fallback)
    // ─────────────────────────────────────────────────────────────────────────────
    function startListening() {
      if (!apiKey) {
        openSettingsModal();
        return;
      }

      // Stop speech playback and abort pending LLM requests without triggering recognizer stop collision
      if (activeAbortController) {
        activeAbortController.abort();
        activeAbortController = null;
      }
      const bridge = getNativeBridge();
      if (bridge) {
        try { bridge.stopSpeaking(); } catch (e) { }
      }
      if (webSynth) {
        webSynth.cancel();
      }
      sentenceQueue = [];
      isSpeakingQueue = false;
      sentenceBuffer = '';

      if (bridge) {
        startSessionTimer();
        setState('LISTENING');
        removeEmptyPlaceholder();
        createUserMessageRow();
        try {
          bridge.startListening();
        } catch (err) {
          console.warn('Native startListening failed:', err);
        }
      } else if (webRecognition) {
        try { webRecognition.start(); } catch (e) { }
      }
    }

    function stopListening() {
      const bridge = getNativeBridge();
      if (bridge) {
        try { bridge.stopListening(); } catch (e) { }
      } else if (webRecognition) {
        try { webRecognition.stop(); } catch (e) { }
      }
    }

    function stopAllAudio() {
      stopListening();
      if (activeAbortController) {
        activeAbortController.abort();
        activeAbortController = null;
      }
      const bridge = getNativeBridge();
      if (bridge) {
        try { bridge.stopSpeaking(); } catch (e) { }
      }
      if (webSynth) {
        webSynth.cancel();
      }
      sentenceQueue = [];
      isSpeakingQueue = false;
      sentenceBuffer = '';
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // UI Bubbles
    // ─────────────────────────────────────────────────────────────────────────────
    function removeEmptyPlaceholder() {
      const emptyEl = document.getElementById('transcriptEmpty');
      if (emptyEl) emptyEl.remove();
    }

    function createUserMessageRow() {
      const row = document.createElement('div');
      row.className = 'line-row user';
      row.innerHTML = `
        <div class="line-col">
          <div class="line user interim">Listening...</div>
        </div>
      `;
      transcript.appendChild(row);
      currentUserRow = row;
      scrollTranscript();
    }

    function createModelMessageRow() {
      const row = document.createElement('div');
      row.className = 'line-row model';
      row.innerHTML = `
        <div class="avatar-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/>
            <line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>
        </div>
        <div class="line-col">
          <div class="line model">...</div>
          <div class="line-meta" style="display:none;">⚡ <span class="ttft-val">0</span>ms</div>
        </div>
      `;
      transcript.appendChild(row);
      currentModelRow = row;
      scrollTranscript();
      return row;
    }

    function scrollTranscript() {
      transcript.scrollTop = transcript.scrollHeight;
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // Gemini Flash Streaming (gemini-3.1-flash-lite)
    // ─────────────────────────────────────────────────────────────────────────────
    const MAX_HISTORY_TURNS = 12; // Bounded sliding window: 6 user turns + 6 model turns

    async function streamGeminiFlash(userText) {
      if (!apiKey) return;

      setState('THINKING');
      llmStartTime = performance.now();
      sentenceBuffer = '';
      sentenceQueue = [];
      isSpeakingQueue = false;

      conversationHistory.push({
        role: 'user',
        parts: [{ text: userText }]
      });

      createModelMessageRow();
      const textEl = currentModelRow.querySelector('.line.model');
      const metaEl = currentModelRow.querySelector('.line-meta');
      const ttftEl = currentModelRow.querySelector('.ttft-val');
      textEl.textContent = '';

      activeAbortController = new AbortController();

      // Sliding window to bound token cost and memory accumulation
      const boundedHistory = conversationHistory.slice(-MAX_HISTORY_TURNS);

      const payload = {
        contents: boundedHistory,
        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
        generationConfig: {
          maxOutputTokens: 200,
          temperature: 0.7
        }
      };

      let targetModel = PRIMARY_MODEL;
      let response = await makeStreamRequest(targetModel, payload);

      if (!response.ok && response.status === 404) {
        console.warn(`Model ${PRIMARY_MODEL} not found, falling back to ${FALLBACK_MODEL}`);
        targetModel = FALLBACK_MODEL;
        response = await makeStreamRequest(targetModel, payload);
      }

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        textEl.textContent = `Error: ${errData.error?.message || response.statusText}`;
        setState('IDLE');
        return;
      }

      let fullCoachReply = '';
      let isFirstToken = true;

      try {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('data: ')) {
              const dataStr = trimmed.slice(6);
              if (dataStr === '[DONE]') continue;
              try {
                const parsed = JSON.parse(dataStr);
                const chunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
                if (chunk) {
                  if (isFirstToken) {
                    isFirstToken = false;
                    const ttft = Math.round(performance.now() - llmStartTime);
                    ttftEl.textContent = ttft;
                    metaEl.style.display = 'flex';
                  }

                  fullCoachReply += chunk;
                  textEl.textContent = fullCoachReply;
                  scrollTranscript();

                  // Pipelined sentence synthesis
                  processChunkForSpeech(chunk);
                }
              } catch (e) { }
            }
          }
        }

        if (sentenceBuffer.trim()) {
          enqueueSentenceForSpeech(sentenceBuffer.trim());
          sentenceBuffer = '';
        }

        conversationHistory.push({
          role: 'model',
          parts: [{ text: fullCoachReply }]
        });

      } catch (err) {
        if (err.name === 'AbortError') return;
        console.error('Stream Error:', err);
        setState('IDLE');
      }
    }

    async function makeStreamRequest(model, payload) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse&key=${apiKey}`;
      return fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: activeAbortController.signal
      });
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // Sentence-Pipelined Voice Engine (Android Native TTS vs Web Speech)
    // ─────────────────────────────────────────────────────────────────────────────
    function processChunkForSpeech(chunk) {
      sentenceBuffer += chunk;
      const regex = /([^.?!:\n]+[.?!:\n]+)/g;
      let match;
      let lastIndex = 0;

      while ((match = regex.exec(sentenceBuffer)) !== null) {
        const sentence = match[0].trim();
        if (sentence.length > 1) {
          enqueueSentenceForSpeech(sentence);
        }
        lastIndex = regex.lastIndex;
      }

      if (lastIndex > 0) {
        sentenceBuffer = sentenceBuffer.slice(lastIndex);
      }
    }

    function enqueueSentenceForSpeech(text) {
      const clean = text.replace(/[\*\_#]/g, '').trim();
      if (!clean) return;

      sentenceQueue.push(clean);
      if (!isSpeakingQueue) {
        playNextSentence();
      }
    }

    function playNextSentence() {
      if (!sentenceQueue.length) {
        isSpeakingQueue = false;
        setState('IDLE');

        // Hands-Free VAD Auto-Rearm Loop: auto-listen for next user turn after natural conversational pause
        if (isSessionStarted && state !== 'LISTENING') {
          setTimeout(() => {
            if (state === 'IDLE') {
              startListening();
            }
          }, 350);
        }
        return;
      }

      isSpeakingQueue = true;
      setState('SPEAKING');

      const text = sentenceQueue.shift();
      utteranceCounter++;
      const currentUtteranceId = 'utt_' + utteranceCounter;

      const bridge = getNativeBridge();
      if (bridge) {
        try {
          bridge.speakText(text, currentUtteranceId);
        } catch (err) {
          console.warn('Native speakText failed:', err);
          playNextSentence();
        }
      } else if (webSynth) {
        const utterance = new SpeechSynthesisUtterance(text);
        if (selectedWebVoice) utterance.voice = selectedWebVoice;
        utterance.rate = 1.30;
        utterance.pitch = 1.02;
        utterance.onend = () => playNextSentence();
        utterance.onerror = () => playNextSentence();
        webSynth.speak(utterance);
      } else {
        playNextSentence();
      }
    }
  </script>
